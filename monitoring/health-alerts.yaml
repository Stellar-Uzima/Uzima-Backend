# Prometheus Alertmanager configuration for health check failure alerts
# Service-Level Monitoring Targets (Issue 150)
#
# Measurement window: 5m rolling windows for latency/error SLIs, 30d for availability SLO.
# Endpoint scope: uzima-backend API workflows (/health, /api/* request paths).
# Thresholds:
#   - Availability SLO: >= 99.9% successful (non-5xx) requests over 30d
#   - Error rate: 5xx ratio > 1% over 5m (warning), > 5% over 5m (critical)
#   - Latency p95: <= 500ms over 5m (warning), p99 <= 1500ms over 5m (critical)
#   - Health endpoint /health: must return 200 within 1s
#
# Dashboards and alerts reference these targets; review after each incident.

groups:
- name: uzima-slo-targets
  rules:
  # Recording rules for SLI measurement windows
  - record: uzima:http_request_error_ratio:rate5m
    expr: |
      sum(rate(http_server_requests_seconds_count{job=~"uzima-backend.*",status=~"5.."}[5m]))
      /
      sum(rate(http_server_requests_seconds_count{job=~"uzima-backend.*"}[5m]))

  - record: uzima:http_request_latency_p95:rate5m
    expr: |
      histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job=~"uzima-backend.*"}[5m])))

  - record: uzima:http_request_latency_p99:rate5m
    expr: |
      histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{job=~"uzima-backend.*"}[5m])))

  - record: uzima:http_request_availability:ratio30d
    expr: |
      1 - (
        sum(increase(http_server_requests_seconds_count{job=~"uzima-backend.*",status=~"5.."}[30d]))
        /
        sum(increase(http_server_requests_seconds_count{job=~"uzima-backend.*"}[30d]))
      )

  # SLO breach alerts tied to documented targets
  - alert: ErrorRateAboveWarningTarget
    expr: uzima:http_request_error_ratio:rate5m > 0.01
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Backend 5xx error ratio above 1% target"
      description: "5xx ratio over 5m is {{ $value | humanizePercentage }}, exceeding the 1% warning threshold for uzima-backend API workflows."

  - alert: ErrorRateAboveCriticalTarget
    expr: uzima:http_request_error_ratio:rate5m > 0.05
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Backend 5xx error ratio above 5% target"
      description: "5xx ratio over 5m is {{ $value | humanizePercentage }}, exceeding the 5% critical threshold for uzima-backend API workflows."

  - alert: LatencyP95AboveWarningTarget
    expr: uzima:http_request_latency_p95:rate5m > 0.5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Backend p95 latency above 500ms target"
      description: "p95 latency over 5m is {{ $value }}s, exceeding the 500ms warning target for uzima-backend API workflows."

  - alert: LatencyP99AboveCriticalTarget
    expr: uzima:http_request_latency_p99:rate5m > 1.5
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Backend p99 latency above 1500ms target"
      description: "p99 latency over 5m is {{ $value }}s, exceeding the 1500ms critical target for uzima-backend API workflows."

  - alert: AvailabilityBelowSLO
    expr: uzima:http_request_availability:ratio30d < 0.999
    for: 15m
    labels:
      severity: critical
    annotations:
      summary: "30-day availability below 99.9% SLO"
      description: "30-day availability is {{ $value | humanizePercentage }}, below the 99.9% SLO target. Review dashboards and incident history."

- name: uzima-health-alerts
  rules:
  # Alert if any pod is not ready
  - alert: PodNotReady
    expr: kube_pod_status_ready{condition="true",pod=~"uzima-backend-.*"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Pod {{ $labels.pod }} is not ready"
      description: "Backend pod {{ $labels.pod }} has failed readiness probes for more than 1 minute"

  # Alert if less than 2 replicas are available
  - alert: InsufficientBackendReplicas
    expr: count(kube_pod_status_ready{condition="true",pod=~"uzima-backend-.*"}) < 2
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Insufficient backend replicas available"
      description: "Only {{ $value }} backend pods are ready, minimum 2 required"

  # Alert on application-level health check failures (from /health endpoint)
  - alert: ApplicationHealthCheckFailed
    expr: http_server_requests_seconds_count{status="503",uri="/health"} > 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "Health check failed on {{ $labels.instance }}"
      description: "Instance {{ $labels.instance }} returned 503 Service Unavailable for health check"

  # Alert on high queue backlog (detected from health check metrics)
  - alert: HighQueueBacklog
    expr: application_queue_jobs_waiting > 100
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High queue backlog detected"
      description: "Total waiting jobs across all queues exceeds 100, current value: {{ $value }}"

  # Alert on low Redis hit rate
  - alert: LowRedisHitRate
    expr: application_redis_hit_rate < 0.8
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Redis cache hit rate is low"
      description: "Redis hit rate has dropped below 80%, current rate: {{ $value | humanizePercentage }}"

  # Scheduled job health monitoring:
  # Each critical schedule reports last successful execution and current status via
  # application_scheduled_job_last_success_timestamp_seconds and
  # application_scheduled_job_status (1 = healthy, not 1 = failing).

  # Alert when a critical job has not succeeded within its expected interval
  # (missed/delayed run). The job exports its expected interval in seconds.
  - alert: ScheduledJobMissedRun
    expr: (time() - application_scheduled_job_last_success_timestamp_seconds) > application_scheduled_job_expected_interval_seconds
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Scheduled job {{ $labels.job }} missed its run"
      description: "Scheduled job {{ $labels.job }} has not succeeded for {{ $value | humanizeDuration }}, exceeding its expected interval. Last successful run timestamp is exported as application_scheduled_job_last_success_timestamp_seconds."

  # Alert when a critical job is repeatedly failing (current status not healthy)
  - alert: ScheduledJobRepeatedlyFailing
    expr: application_scheduled_job_consecutive_failures >= 3
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Scheduled job {{ $labels.job }} is repeatedly failing"
      description: "Scheduled job {{ $labels.job }} has failed {{ $value }} consecutive times. Last success timestamp is exported by application_scheduled_job_last_success_timestamp_seconds."

  # Alert when a critical job's current status is not healthy (status != 1)
  - alert: ScheduledJobUnhealthy
    expr: application_scheduled_job_status != 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Scheduled job {{ $labels.job }} is unhealthy"
      description: "Scheduled job {{ $labels.job }} reports an unhealthy current status. Last success timestamp is exported by application_scheduled_job_last_success_timestamp_seconds."
